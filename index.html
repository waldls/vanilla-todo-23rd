<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla Todo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header id="appHeader">
        <h1>Vanilla Todo</h1>
      </header>
      <main id="appMain">
        <section id="calendarSection">
          <div id="calendar" role="region" aria-labelledby="calendarTitle">
            <div id="calendarHeader">
              <button id="prevMonthBtn" aria-label="이전 달">&#9664;</button>
              <span id="calendarTitle"></span>
              <button id="nextMonthBtn" aria-label="다음 달">&#9654;</button>
            </div>
            <div id="calendarWeekdays" role="row">
              <span>일</span>
              <span>월</span>
              <span>화</span>
              <span>수</span>
              <span>목</span>
              <span>금</span>
              <span>토</span>
            </div>
            <div id="calendarDays" role="grid"></div>
          </div>
          <aside id="monthStats" role="region" aria-label="이번 달 통계">
            <div id="statsHeader">
              <p id="statsText" aria-live="polite"></p>
              <span id="statsPercent" aria-live="polite"></span>
            </div>
            <div
              id="progressBarTrack"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              aria-label="이번 달 완료율"
            >
              <div id="progressBarFill"></div>
            </div>
          </aside>
        </section>
        <section id="todoSection" aria-label="할일 목록">
          <h2 id="selectedDateTitle"></h2>
          <div id="todoListWrapper">
            <ul id="todoList" aria-live="polite" aria-label="할일 목록"></ul>
          </div>
          <div id="todoInputArea">
            <input
              type="text"
              id="todoInput"
              placeholder="할일을 입력하세요."
              autocomplete="off"
              aria-label="할일 입력"
            />
            <button id="todoAddBtn">추가</button>
          </div>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
